# @package _global_
# Phase J shared setup: the budget-constrained re-run of the adversarial-defense
# control problem (docs/experiments/budget_constrained_defense_plan.md, from
# docs/next_step_diagnosis.md section 4 step 2). Every Phase J arm composes this file so
# the attack set / seeds / budget are physically impossible to get out of sync
# between arms -- an arm-by-arm copy of `attack_ids` would make a silent
# mismatch (i.e. an incomparable comparison) a one-typo mistake.
#
# Why k=1 and not the k=2 the plan doc first proposed: on these 5-turn attack
# sequences the existing arms already spend at most 2 reminders per trajectory
# (Phase I's v-aligned controller: max 2, mean 1.31; Phase G periodic: exactly
# 2 on turns 2/4), so a budget of 2 is NOT binding -- it would reproduce Phase I
# exactly and burn GPU time to learn nothing. k=1 is the smallest budget that
# actually forces an allocation decision, and it is the setting where a fixed
# schedule has to commit to one turn in advance while an adaptive policy can
# wait for evidence.
#
# 2026-09-03 (seed expansion): `seeds` grew from [0, 1] to [0, 1, 2, 3, 4],
# i.e. docs/next_step_diagnosis.md section 4 step 3 -- the plan doc's own
# section 10.7 records that 2 seeds x 8 attacks could not separate adjacent
# arms (the three top arms' CIs overlapped by more than their true spacing),
# and made this expansion a precondition for anything else on this line.
# Trajectories are keyed `<attack_id>__seed<n>` and each one's sampling seed
# is its own (chat_model.generate calls torch.manual_seed(seed) per call), so
# the 16 already-collected trajectories per arm are re-used verbatim and only
# the 24 new ones are generated -- this is a resume, not a re-run, which is
# why every Phase J sbatch now passes `allow_config_change=true` (the guard
# would otherwise refuse the changed `seeds` key; see run_config_guard.py).
# The 2-seed artifacts of each arm are preserved under
# outputs/<arm>/snapshot_2seed/ so the numbers written up in section 10 stay
# auditable after the reports are regenerated over all 5 seeds.
task:
  screening:
    seeds: [0, 1, 2, 3, 4]
    # The same 8 held-out attacks as every Phase E/G/H/I arm (Phase C's
    # identification split), so Phase J is comparable to all of them.
    attack_ids:
      - safemtdata_0074
      - safemtdata_0169
      - safemtdata_0257
      - safemtdata_0289
      - safemtdata_0324
      - safemtdata_0329
      - safemtdata_0476
      - safemtdata_0530
    remind_budget: 1
    episode_length: 5
