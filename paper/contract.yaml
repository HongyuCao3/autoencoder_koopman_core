    rhs_symbols: [s10, s14, s15]
    in_section: method
    has_gloss: false
    role: distribution_diagnostic

# ---------------------------------------------------------------------------------------
# MECHANISMS
# ---------------------------------------------------------------------------------------
mechanism_lattice:
  - id: m1
    mechanism: "The behavioral readout is persistent: what a trajectory is doing at turn t
      constrains turn t+1, so a state that carries past readouts fits better than one that does
      not. This is why memory pays."
    supports_claim: [c1]
    appears_in_method: true
    appears_in_experiments: true
    notes: "The mechanism quantity that tracks this is the older lag's loading in A, not the
      state half-life; half-life and whether memory pays do not co-sign."
  - id: m2
    mechanism: "Most of that persistence is a property of the item rather than of the trajectory:
      hard items stay hard across all their turns, so a per-item intercept reproduces most of
      what the delay embedding was credited with."
    supports_claim: [c8, c1]
    appears_in_method: true
    appears_in_experiments: true
    notes: "This is the mechanism paragraph in section 5.x. It replaces the operator-spectrum
      mechanism figure, which was proposed and did not pass its own pre-signed criterion."
  - id: m3
    mechanism: "The intervention's authority is large but its timing is not state-dependent: the
      action moves the readout by an order of magnitude more than any rescheduling of the same
      budget does, so a controller that only chooses when to spend has nothing left to win."
    supports_claim: [c5, c6, c4]
    appears_in_method: true
    appears_in_experiments: true
    notes: "This is the paper's transferable negative result. Bounded to these four task
      families, which are all 'a text property pushed by a reminder or a rewrite'."
  - id: m5
    mechanism: "A shallow state is estimable from earlier transitions than a deep one, so under the
      default caliber the memoryless arm is fitted on a strictly smaller and later slice of each
      trajectory. Part of what looked like the value of depth is the value of those extra rows."
    supports_claim: [c2, c1]
    appears_in_method: false
    appears_in_experiments: true
    notes: "Drives the ablation's driver sentence. It is why the matched-window companion exists."
  - id: m6
    mechanism: "The readout trajectories are close to linear in the delay-embedded state over the
      horizons scored here, so a learned lifting has almost nothing left to model and spends its
      extra capacity on variance instead."
    supports_claim: [c3]
    appears_in_method: true
    appears_in_experiments: true
    notes: "Stated as the reason the effect sizes are small AND sign-inconsistent. Sign inconsistency
      is the signature of variance, not of a missing nonlinearity."
  - id: m7
    mechanism: "The instruction family fixes which actions are even expressible, so it moves the
      outcome more than any policy choosing among actions inside one family."
    supports_claim: [c9]
    appears_in_method: false
    appears_in_experiments: true
    notes: "Observation-strength, one line only."
  - id: m4
    mechanism: "Because the action's effect on the fit is what a controller would exploit,
      measuring that effect at identification time predicts whether closed-loop control can pay,
      without running the closed loop."
    supports_claim: [c7]
    appears_in_method: true
    appears_in_experiments: true
    notes: "One-directional; the mechanism licenses the negative inference only."

# ---------------------------------------------------------------------------------------
# INTUITION LATTICE -- required non-empty under prior_injection.
# Extracted from docs/, not invented here; recorded_at is honest.
# ---------------------------------------------------------------------------------------
intuition_lattice:
  priors:
    - id: prior_1
      statement: "How a conversation is behaving right now tells you something about how it will
        behave next, in the same way a physical system's present state constrains its future."
      borrowed_authority: []
      recorded_at: L3
      source: "docs/article/PAPER_EXECUTION_PLAN.md#1.1"
    - id: prior_2
      statement: "If a system's future is a function of its state, then the fitted description of
        that system is also a description of what any controller could hope to do to it."
      borrowed_authority: []
      recorded_at: L3
      source: "docs/article/CLOSED_LOOP_SYNTHESIS.md#6.3"
  anchor_example:
    id: ex_1
    instance: "A reader asked to simplify a paragraph one step at a time: the level it sits at now
      is what decides whether the next instruction should push it down a full level, half a level,
      or leave it alone."
    illustrates: [prior_1, prior_2]
    home: problem_formulation_entrance
    covers_both_sides: true
    recorded_at: post_hoc
    source: "author_decision, built on docs/NAMING.md's tsar_cefr line description"
    notes: "Covers both sides: the state constrains the next action (the prior pays) and the
      instruction's effect does not depend on when it is issued (the prior stops paying)."
  failure_instances:
    - id: fx_1
      instance: "a fixed schedule that ignores the conversation ties the controller"
      homes: [abstract, intro]
      quantified_by: rq3
      recorded_at: L3
      source: "docs/article/CLOSED_LOOP_SYNTHESIS.md#1"
  named_assumptions:
    - id: as_1
      name: "Assumption 1 (Readout Persistence)"
      plain_statement: "A window of past readouts carries information about the next readout that
        the current turn alone does not."
      formal_pointer: eq_1
      strength: tendency
      tested_by: rq1
      recorded_at: L3
      source: "docs/experiments/core_surrogate_rows_results.md"
    - id: as_2
      name: "Assumption 2 (Action Identifiability)"
      plain_statement: "The intervention varies independently enough of the state that its effect
        on the next state can be estimated separately from the state's own evolution."
      formal_pointer: eq_5
      strength: approximate
      tested_by: rq2
      recorded_at: L3
      source: "docs/experiments/core_multiobjective_planning_headroom.md"
      notes: "Measured false on the core line by construction and measured to buy nothing on all
        eleven columns. Stating it as an assumption and then reporting that it fails is the
        paper's second finding, not a defect in the framing."
    - id: as_3
      name: "Assumption 3 (Identification Predicts Control)"
      plain_statement: "If withholding the action does not change how well the operator fits, then
        no controller built on that operator can beat an equal-cost fixed schedule."
      formal_pointer: eq_8
      strength: tendency
      tested_by: rq3
      recorded_at: L3
      source: "docs/article/CLOSED_LOOP_SYNTHESIS.md#6.3"
      notes: "Checked on its zero side on four lines. The non-zero side is untested, so this
        assumption licenses a negative inference only. See c7 and nc_2."

# ---------------------------------------------------------------------------------------
# NON-CLAIMS -- required under prior_injection, and this project has a lot of them.
# ---------------------------------------------------------------------------------------
non_claim_ledger:
  - id: nc_1
    statement: "That a simple baseline beats Koopman-MPC."
    reason: "Outside the defense column no baseline won. Three columns tie with intervals
      containing zero, and on two of them ours costs more. 'Tied, and ours cost more' is the
      supported statement; 'beaten' is not."
    appears_in: [experiments, conclusion]
  - id: nc_2
    statement: "That a non-zero withheld-action contrast predicts closed-loop control will pay."
    reason: "The criterion has only been checked on its zero side. The pre-registered positive
      control was the readability column, signed to be non-zero, and it came in at +0.0061 with
      the interval containing zero. Without a task family where the contrast is genuinely
      non-zero and the closed loop then pays, the positive direction is untested."
    appears_in: [conclusion]
  - id: nc_3
    statement: "That closed-loop control of multi-turn LLM behavior does not work in general."
    reason: "Four task families, all of the same shape: a text property pushed by a reminder or a
      rewrite. The result is about these four settings and the three preconditions we name, not
      about LLM control."
    appears_in: [conclusion]
  - id: nc_4
    statement: "That nonlinearity is useless for this problem."
    reason: "The effect sizes are small and sign-inconsistent, which is a different statement. On
      one column the LSTM is better with an interval excluding zero, and on the readability column
      neither nonlinear baseline cleared the trivial null, which is a sample-size fact."
    appears_in: [experiments, conclusion]
  - id: nc_5
    statement: "That the action's effect cashes out in one step, which is why rescheduling cannot
      buy anything."
    reason: "The statistic that would support this measures whether an effect is still present at
      step k, not whether it is arriving at step k, and on a synthetic one-step action it still
      reads long. The paper does not use the action channel's time structure as mechanism
      evidence."
    appears_in: [conclusion]
  - id: nc_6
    statement: "That the multi-step term in the joint objective was shown not to help."
    reason: "It was never swept at comparable strength: it receives one gradient step per epoch
      against one per minibatch for the other terms, so its weight confounds with dataset size."
    appears_in: [conclusion]
  - id: nc_7
    statement: "That the defense line's precondition was refuted."
    reason: "It could not be asked. At a 9.8 percent base rate the design has no power, which is
      not the same as a negative result, and the two must not share wording."
    appears_in: [experiments, conclusion]
  - id: nc_8
    statement: "That the adaptivity bounds constrain any controller."
    reason: "They bound only policies measurable with respect to the scalar readout. A controller
      reading raw text or activations is not bounded by them."
    appears_in: [experiments, conclusion]
