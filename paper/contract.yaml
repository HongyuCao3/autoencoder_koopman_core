# Tier 1 contract — ICLR 2027 positive-result draft.
# Rebuilt 2026-09-18 (Phase 0.4) from story_framework_2026-09-18.md, the colleague's
# sections/02_method.tex, and the two evidence ledgers. Nothing here was invented at
# writing time: every claim points at an id in evidence/numbers.yaml (self-built tasks)
# or evidence/numbers_benchmark.yaml (colleague benchmark results).
#
# Four numbers in the story framework did not survive the recount in tools/build_tables.py.
# They are corrected here and listed in DECISIONS.md's open items. Search "RECOUNT" below.
#
# IDs are immutable once Tier 2 references them. Renaming needs a sweep:
#   grep -rnE '\b(choice_2|c3|eq_koopman_model)\b' paper/

meta:
  paper_title: "KOMPAS: Koopman Dynamics Modeling and Predictive Control of Multi-Turn LLM Behavior"
  acronym: KOMPAS               # D10 (2026-09-18), title revised by D14 (2026-09-19).
                                # Expansion, capitals form the name (rhetoric_patterns.md §1, the
                                # mid-word capital is house style: MOAT = reinforceMent-enhanced
                                # autOregressive feAture Transformation):
                                #   KOopman dynaMics modeling and Predictive control of
                                #   Attributes at the prompt Step
                                # D14: the title must name both halves of the paper. "Dynamics
                                # modeling" replaces "prediction" because the contribution is a
                                # model of the dynamics, not a forecasting score; "control" is
                                # named outright rather than hidden inside "model-predictive".
                                # Reveal once in Abstract Move 4 and once in Introduction P4, bold
                                # inline; plain KOMPAS everywhere after that.
                                # Collision check: websearch "KOMPAS method acronym machine learning
                                # arxiv" (2026-09-18) returned no ML method of this name.
  venue: ICLR
  page_limit: 9
  subfield: "inference-time attribute control and multi-turn behavior control of frozen LLMs"
              # D22 (2026-09-19): "test-time alignment" removed. That term denotes
              # preference/reward alignment; this paper tracks a scalar attribute to a
              # reference on instruction-following benchmarks. User-approved change to a
              # signed Tier-1 contract (D20 requires user sign-off; granted 2026-09-19).
  benchmarks: # Tier-1 cold review of the Intro outline (f2, 2026-09-19): the names were being
              # cited by Tier 2 without ever passing through the contract. Verified against
              # evidence/numbers_benchmark.yaml, which carries a `benchmark` field on all 88 rows,
              # and against the colleague's table caption in _colleague_backup_2026-09-18/4-experiment.tex.
    - name: IFBench
      subtasks: [WC, UWC, NS, NP]
    - name: IFEval
      subtasks: [KF, WC, NS, NP]
    - name: COLLIE
      subtasks: [Word, "Sent.", "Para."]
    # 4 + 4 + 3 = the eleven subtasks every control claim averages over.
  plan_version: "WRITING_PLAN_2026-09-19.md v2.1 (Method rewrite, D25-D35)"
  structure:
    method_subsections: [model, learning, controller, guarantee]   # D25
  arc_type: challenge_driven    # deployment gaps -> contributions; beat 2 carries the access gap,
                                # beat 3 carries both the stateless gap and the missing-model gap

narrative_arc:
  - "Multi-turn interaction makes a frozen LLM's reply attributes a trajectory, and that trajectory drifts as an instruction given once competes with every turn that accumulates after it."
  - "Every existing controller acts inside the network and needs white-box access at every token, while the lever a deployment actually holds is one instruction per turn against a black-box API."
  - "Prompt-level interventions today are stateless, so they overshoot or undershoot; what is missing is a dynamics model at the interaction level."
  - "We identify a command-conditioned Koopman dynamics model on delay coordinates of the verifier reading, taking one prompt-response exchange as one step; in its reported linear instance the fit is a least-squares problem over recorded transitions."
  - "We use that model to score candidate instructions before any of them is sent, holding a candidate command over a horizon and replanning from each actual reading."
  - "The controller raises constraint satisfaction by about fifteen points over an uncontrolled model and by about five over two white-box latent controllers, with no extra LLM call per candidate."

design_choice_lattice:
  - id: choice_1
    choice_name: "Finite-Memory Interaction State"
    why_keyword: "stated as an observability fact in Problem Formulation section 2.1 (a black-box caller obtains only a verifier's reading of a finished reply, and the objective is stated in that same reading); no Why paragraph in Method (D32)"
    home: method_3.1_P2
    equation_operation: "stack of the last L+1 attribute readings, with a selector row that reads the current one back out"
    equation_id: eq_memory_state
    rq_id: rq2a
    finding_keyword: "history beyond the current turn is needed on 5 of 7 columns; the paired difference against a last-turn state excludes zero there"
    intro_bullet_keyword: "a finite-memory state over observable attributes, no hidden-state access"
    conclusion_takeaway_keyword: "a window of past readings, not the current one, is what makes the next step predictable"
    source: "code:src/koopman_ae/core.py"
    intuition_refs: [prior_1, ex_1, as_1]
    notes: >-
      The colleague's Method already carries the both-directions example; it is ex_1's single home.
      D19 (2026-09-19): delay embedding itself is settled practice for partially observed systems,
      so the Why-X argues the windowed quantity, not the windowing. See the consensus scan in the
      project doc method_novelty_scan_2026-09-19.

  - id: choice_2
    choice_name: "Koopman Dynamics Model on Delay Coordinates"
    why_keyword: "a modeling argument: why a finite-dimensional linear operator can approximate a multi-turn attribute sequence at all. It answers the ARX objection head on, conceding that the reported instance is numerically a delay regression with an exogenous input, and naming the three things the Koopman view adds that the regression view does not: the operator acts on observables so the dictionary can be swapped (a learned lifting is the same model, not another one), the multi-step rollout has a closed form, and the resulting predictor drops into standard MPC machinery"
    equation_operation: "affine map of the delay-coordinate state plus a command-scaled column and a bias"
    equation_id: eq_koopman_model
    rq_id: rq2b
    secondary_rq: rq1
    finding_keyword: "the linear delay-coordinate instance ranks first on four of seven tasks, and a learned lifting beats it on none of them"
    intro_bullet_keyword: "a Koopman dynamics model on delay coordinates whose linear instance ranks first on four of seven tasks and is not beaten by a learned lifting"
    conclusion_takeaway_keyword: "a linear operator on a short window of readings is enough; the lifting can stay off"
    home: method_3.1
    source: "code:src/koopman_ae/core.py"
    intuition_refs: [prior_2, as_2]
    notes: >-
      D2: the reported Ours row is the special case E_phi = D_psi = id.
      Tier-1 cold review f1 (2026-09-18): this choice was first filed under rq2b, which
      actually tests the lifting, not the command channel. It is now filed under rq1,
      because the control experiment is the only place the command varies and therefore
      the only place the channel does any work. No experiment isolates the command column
      against a no-command ablation on the prediction task, and nc_1 and nc_8 say so.
      D19 (2026-09-19): rq2b now reads on this choice as a secondary test. The reported instance
      is the linear special case, so the question "would a learned lifting do better" is a question
      about this choice's instantiation; its ablation and the training objective both move to
      appendix A1.
      D26 (2026-09-19): the primary rq_id moves back to rq2b and rq1 becomes secondary. D11's
      reading is unchanged (the control experiment is still the only place the command varies and
      therefore the only test of the channel); it is no longer this choice's PRIMARY evidence,
      because with choice_1 and choice_3 as they stand the lattice otherwise reads 2 control : 1
      modeling, against the title (D14) and the claim order (D17). The Why paragraph is also
      re-aimed: it now argues modeling capacity rather than the command coordinate. The
      command-coordinate argument survives as a short protocol statement in 3.1 P4, not as a
      Why paragraph.

  - id: choice_3
    choice_name: "Predictive Candidate Selection"
    why_keyword: "planning on a lifted linear predictor is standard model-predictive control, so what this subsection has to justify is scoring candidates without opening the model: they are compared on predicted readings alone, which is what lets the controller run against an interface that returns only text"
    equation_operation: "argmin over candidate commands of a horizon-weighted squared deviation from the target"
    equation_id: eq_selection
    rq_id: rq1
    finding_keyword: "+14.5 and +14.8 points over an uncontrolled model, +5.2 and +5.7 over the stronger white-box controller, best in all 22 cells"
    intro_bullet_keyword: "model-predictive selection of the next instruction, black-box and with no extra generation per candidate, raising constraint satisfaction by 14.5 points over the uncontrolled model and by 5.2 over the stronger white-box controller"
    home: method_3.3
    conclusion_takeaway_keyword: "planning one instruction ahead in a learned latent space beats steering inside the network"
    source: "code:src/koopman_ae/core.py"
    intuition_refs: [prior_3, fx_1]   # as_3 removed: A10 forbids a contribution leaning on an untested assumption (cold review f4)
    notes: >-
      rq3 also reads on this choice, for the cost side. D19 (2026-09-19): lifted-space MPC is
      Korda and Mezic's result, so the Why-X argues the black-box constraint rather than the
      planning machinery. This is also where the access asymmetry with TMPC and RE-Control is
      turned into an advantage instead of being apologized for.
      D34 (2026-09-19): Algorithm 1 (the receding-horizon loop) lives in this subsection, and the
      cost sentence in Experiments 4.4 points at its for-loop rather than restating it.

claim_ledger:
  # --- Modeling line: what the operator predicts (self-built multi-turn tasks) ---
  - id: c1
    claim: "A window of past attribute readings predicts better than the current reading alone on five of seven tasks, with paired bootstrap intervals excluding zero."
    strength: scoped
    evidence:
      - "figure_panel:fig_memory_forest:all (n_main_013 n_main_045 n_main_029 n_main_077 n_main_093 n_main_132 n_main_180)"
    appears_in: [intro, experiments, conclusion]
    driver_keyword: "the window exposes the direction of travel, which a single reading cannot carry"
    notes: "RECOUNT: five of seven, not all. vector_count_stage1 has an interval containing zero (+0.246, [-0.023, +0.415]); formality is negative and not separated from zero (-0.035). The prose names the two exceptions."

  - id: c2
    claim: "A learned nonlinear lifting does not predict better than the identity lifting on any of the seven tasks, and predicts worse on four of them with intervals excluding zero."
    strength: scoped
    evidence:
      - "table_cell:tab_prediction:R{KOMPAS (learned lifting)}:C{all 7} (n_main_010 n_main_042 n_main_026 n_main_074 n_main_090 n_main_129 n_main_177)"
      - "table_cell:tab_prediction:R{KOMPAS (linear)}:C{all 7} (n_main_004 n_main_036 n_main_020 n_main_068 n_main_084 n_main_131 n_main_179)"
      - "figure_panel:fig_lifting_contrast:all (n_main_015 n_main_047 n_main_031 n_main_079 n_main_095 n_main_135 n_main_183)"
    appears_in: [experiments, conclusion]
    driver_keyword: "the attribute readouts are already low-dimensional, so a lifting has little structure left to expose"
    notes: "RECOUNT: the story framework said the gap was at most 0.031 with signs flipping. The CEFR column is +0.599 in favour of the linear case, which is not a tie. The claim is stated as 'no gain from lifting', not as 'equivalent'."

  - id: c3
    claim: "Against an LSTM sequence baseline neither model dominates: the linear operator wins two columns and loses two, each with intervals excluding zero."
    strength: observation
    evidence:
      - "figure_panel:fig_lstm_contrast:all (n_main_016 n_main_048 n_main_032 n_main_080 n_main_096 n_main_134 n_main_182)"
    appears_in: [experiments]
    driver_keyword: "no mechanism established for the two losses"
    notes: >-
      RECOUNT and reversal. The story framework said no column favoured the LSTM. Two do:
      character length (-0.031, [-0.052, -0.001]) and constraint (-0.027, [-0.037, -0.015]).
      Stated as an observation, not a claim of superiority. Cold review f8 (2026-09-18): the
      first draft of this row asserted a random-walk explanation for the two losses with
      nothing behind it. Registered instead as an open data question in
      story_framework_2026-09-18.md §8; Rule 1 requires a driver sentence, so either the
      question gets answered before CP3c or the two losses are reported without one.

  - id: c4
    claim: "On free-running prediction skill the linear special case ranks first on four of seven tasks, second on one, and third on two."
    strength: scoped
    evidence:
      - "table_cell:tab_prediction:all-cells (n_main_004 n_main_036 n_main_020 n_main_068 n_main_084 n_main_131 n_main_179)"
    appears_in: [experiments]
    driver_keyword: "the two third places are the two columns where a recurrent baseline fits the residual better"
    notes: "RECOUNT: the story framework said four firsts and the rest seconds. The rest are one second and two thirds."

  - id: c10
    claim: "Under a matched training window, a second past reading buys the whole memory gain on three of the four tasks whose design allows a depth sweep, while constraint keeps gaining through four readings with every increment's interval excluding zero."
    strength: scoped
    evidence:
      - "figure_panel:fig_memory_depth:a (n_abl_124 n_abl_125 n_abl_127 n_abl_184 n_abl_185 n_abl_187 n_abl_157 n_abl_158 n_abl_160 n_abl_235 n_abl_236 n_abl_238)"
      - "figure_panel:fig_memory_depth:b (n_abl_151 n_abl_245 n_abl_262)"
    appears_in: [experiments]
    driver_keyword: "a level and a trend take two readings to express; no mechanism established for constraint's continued gain"
    notes: >-
      Side experiment P1 (2026-09-19), from docs/experiments/paper_side_experiments_results.md
      sections 1 and 6.1. Matched caliber only: every depth is fitted on the same transitions, which
      is what separates depth from training-set size; Table 2's Last-turn row uses the default
      caliber, and the prose says so in one sentence with the sentence-length pair (+0.603 default,
      n_main_013, vs +0.109 matched, n_abl_127). n_abl_151 (sentiment) is caveated because that
      design has two cells only; the prose reports it under panel (b) as a two-depth design.
      The items (s1) interval contains zero at every depth (n_abl_157 n_abl_158 n_abl_160). CEFR
      shows no gain under the matched window (n_abl_262, +0.005), which the prose states; the
      abstract's memory claim must not be worded as holding on every column.

  - id: c11
    claim: "A per-item intercept added to the one-reading state recovers 81% of the memory gain on constraint and 67% on items (s2); the remainder beyond the intercept, +0.045 and +0.075, has intervals excluding zero on those two tasks and on no other Table 2 task."
    strength: scoped
    evidence:
      - "figure_panel:fig_item_effect:all (n_mech_060 n_mech_061 n_mech_059 n_mech_057 n_mech_058 n_mech_056 n_mech_051 n_mech_052 n_mech_050 n_mech_054 n_mech_055 n_mech_053 n_mech_048 n_mech_049 n_mech_047 n_mech_069 n_mech_070 n_mech_068 n_mech_063 n_mech_064 n_mech_062)"
    appears_in: [experiments]
    driver_keyword: "each prompt item holds its own level across turns; several readings estimate it where one cannot"
    notes: >-
      Side experiment P2 (2026-09-19), from paper_side_experiments_results.md section 3 and 6.2.
      Shares: 0.1861/0.2306 = 0.807 and 0.1543/0.2293 = 0.673. The prose must carry the share
      sentence: most of what the delay embedding buys is persistent per-item heterogeneity, not
      inter-turn dynamics, and the dynamics remainder is measured on two tasks only. n_mech_068-070
      (CEFR) are caveated: that task's first reading is a synthetic seed, so the intercept is near
      free, and there is no gain to decompose there (ours minus Last-turn itself contains zero);
      the prose does not present CEFR as the same mechanism as constraint or items (s2).

  # --- Control line: what the controller achieves (colleague benchmark data; D3) ---
  - id: c5
    claim: "Predictive control over prompt-level commands raises constraint satisfaction over the same frozen model with no control, by 14.5 points on Qwen3-4B and 14.8 points on Qwen3-8B averaged over eleven subtasks."
    strength: scoped
    evidence:
      - "table_cell:tab_control:R{Qwen3-4B,Base}:C{all 11} (n_bench_001 n_bench_002 n_bench_003 n_bench_004 n_bench_005 n_bench_006 n_bench_007 n_bench_008 n_bench_009 n_bench_010 n_bench_011)"
      - "table_cell:tab_control:R{Qwen3-4B,KOMPAS}:C{all 11} (n_bench_012 n_bench_013 n_bench_014 n_bench_015 n_bench_016 n_bench_017 n_bench_018 n_bench_019 n_bench_020 n_bench_021 n_bench_022)"
      - "table_cell:tab_control:R{Qwen3-8B,Base}:C{all 11} (n_bench_045 n_bench_046 n_bench_047 n_bench_048 n_bench_049 n_bench_050 n_bench_051 n_bench_052 n_bench_053 n_bench_054 n_bench_055)"
      - "table_cell:tab_control:R{Qwen3-8B,KOMPAS}:C{all 11} (n_bench_056 n_bench_057 n_bench_058 n_bench_059 n_bench_060 n_bench_061 n_bench_062 n_bench_063 n_bench_064 n_bench_065 n_bench_066)"
    appears_in: [abstract, intro, experiments, conclusion]
    driver_keyword: "candidate scoring happens on the predicted trajectory, so a command that differs from the target can be chosen when the trajectory is still moving"
    notes: >-
      Point estimates as printed by the colleague on IFBench, IFEval and COLLIE (see meta.benchmarks;
      eleven subtasks in total). No seeds, no intervals, metric definition still
      pending. D3: the experiments subsection states this in the same subsection as the number.
      D12: the introduction carries one clause naming these as point estimates on three public
      benchmarks; the abstract gives the gain with no interval and without the word measured. The
      Conclusion limitation list repeats it. This caveat is NOT delegated to nc_3, which is
      audit-only under D16; it travels attached to the number.

  - id: c6
    claim: "The same controller exceeds two latent-space controllers that require white-box access, by 5.2 points on Qwen3-4B and 5.7 on Qwen3-8B on average, with a smallest per-subtask margin of 2.4 and 2.7."
    strength: scoped
    evidence:
      - "table_cell:tab_control:R{Qwen3-4B,RE-Control}:C{all 11} (n_bench_034 n_bench_035 n_bench_036 n_bench_037 n_bench_038 n_bench_039 n_bench_040 n_bench_041 n_bench_042 n_bench_043 n_bench_044)"
      - "table_cell:tab_control:R{Qwen3-8B,RE-Control}:C{all 11} (n_bench_078 n_bench_079 n_bench_080 n_bench_081 n_bench_082 n_bench_083 n_bench_084 n_bench_085 n_bench_086 n_bench_087 n_bench_088)"
    appears_in: [abstract, intro, experiments, conclusion]
    driver_keyword: "the comparison is not access-matched, and the weaker access is ours"
    notes: "TMPC and RE-Control are colleague reproductions, not author-run baselines. Same no-interval caveat as c5."

  - id: c7
    claim: "Across the two models and eleven subtasks, the predictive controller is the best of the four methods in every one of the twenty-two cells."
    strength: scoped
    evidence:
      - "table_cell:tab_control:all-cells (n_bench_012 n_bench_022 n_bench_056 n_bench_066)"
    appears_in: [experiments]
    driver_keyword: "the margin is largest where the constraint is hardest to satisfy in one shot"
    notes: "Same point-estimate caveat. A sweep of 22 cells with no intervals is weaker evidence than it looks; the prose reports it as a count, not as a significance statement."

  - id: c8
    claim: "Evaluating a candidate command costs a latent propagation and a decode, and adds no query to the target model."
    strength: strong
    evidence:
      - "equation:eq_closed_form_rollout"
      - "equation:eq_rollout"
    appears_in: [abstract, intro, method, experiments, conclusion]
    driver_keyword: "the closed form makes the h-step latent state a matrix power applied to the current encoding"
    strength_basis: theoretical
    notes: "Structural property of the model, not a measurement. Cold review f7: `strong` here means the derivation is exact, not that a large effect was measured. Any cost of building candidates or scoring responses still counts and the prose says so."

  # --- Bridge: prediction quality to selection quality ---
  - id: c9
    claim: "If the rollout residuals and the readout are bounded, the selected command's held-command cost is within twice the cost-estimation error of the best candidate."
    strength: strong
    evidence:
      - "equation:eq_prediction_bound"
      - "equation:eq_cost_bound"
      - "equation:eq_selection_bound"
    appears_in: [method, experiments, conclusion]
    driver_keyword: "the predicted and actual rollouts start from the same encoding, so their gap accumulates only through the dynamics residual"
    strength_basis: theoretical
    home: method_3.4_proposition_1 + appendix_A6_proof
    notes: >-
      Cold review f7: `strong` means the derivation is exact under its stated assumptions, which
      are themselves untested (as_3). Conditional statement about one held-command comparison. It
      says nothing about the replanned closed loop and the prose keeps that boundary.
      D28 (2026-09-19): the main text carries Proposition 1 in s-space plus one sentence of proof
      idea; the residual assumptions, the cost bound and the full proof move to appendix A6. An
      untested bound does not get a third of the Method section.
symbol_lattice:
  # The colleague's notation is authoritative. The old draft's z_t, u_t, v_t are retired.
  - id: s_x
    symbol: 'x'
    gloss: "task input the dialogue starts from"
    first_defined: problem_formulation
    scope: "fixed within one trajectory"
    appears_in: [problem_formulation, method]
  - id: s_ptheta
    symbol: 'p_{\theta}'
    gloss: "the frozen language model"
    first_defined: problem_formulation
    scope: "parameters never updated"
    appears_in: [problem_formulation]
  - id: s_r
    symbol: 'r'
    gloss: "desired value of the output attribute"
    first_defined: problem_formulation
    scope: "the objective, distinct from the command actually applied"
    appears_in: [problem_formulation, method]
  - id: s_hist
    symbol: '\mathcal{H}_t'
    gloss: "dialogue history before step t"
    first_defined: problem_formulation
    scope: "text, not the memory vector"
    appears_in: [problem_formulation, method]
  - id: s_u
    symbol: 'u_t'
    gloss: "the textual intervention sent at step t"
    first_defined: problem_formulation
    scope: "built by the prompting protocol from a numerical command"
    appears_in: [problem_formulation, method]
  - id: s_o
    symbol: 'o_{t+1}'
    gloss: "the generated reply"
    first_defined: problem_formulation
    scope: "text, distinguished from its measured attribute"
    appears_in: [problem_formulation]
  - id: s_yhat
    symbol: '\widehat y_{t+h\mid t}'
    gloss: "the model's forecast of the attribute h steps ahead, formed from what is known now"
    first_defined: problem_formulation
    scope: "the forecast itself; how it is produced is Method's business"
    appears_in: [problem_formulation, method, experiments]
  - id: s_ell
    symbol: '\ell_h'
    gloss: "squared error of the h-step forecast"
    first_defined: problem_formulation
    scope: "one horizon step; the reported metric aggregates it over the horizon"
    appears_in: [problem_formulation, experiments]
  - id: s_y
    symbol: 'y_t'
    gloss: "measured attribute of the reply at step t"
    first_defined: problem_formulation
    scope: "scalar; one attribute at a time"
    appears_in: [problem_formulation, method, experiments]
  - id: s_V
    symbol: 'V'
    gloss: "task-specific verifier that measures the attribute"
    first_defined: problem_formulation
    scope: "runs on a whole reply, never on a partial generation"
    appears_in: [problem_formulation]
  - id: s_P
    symbol: '\mathcal{P}'
    gloss: "prompting protocol that turns a command into a prompt"
    first_defined: method
    scope: "fixed and known; the paper does not claim coverage of arbitrary text interventions"
    appears_in: [method]
  - id: s_c
    symbol: 'c_t'
    gloss: "numerical command chosen by the controller at step t"
    first_defined: method
    scope: "selected from a finite candidate set; equals the target only in ordinary target-following"
    appears_in: [method, experiments]
  - id: s_Cspace
    symbol: '\mathcal{C}'
    gloss: "the range of admissible numerical commands"
    first_defined: method
    scope: "the whole command range; the per-step candidate set is a finite subset of it"
    appears_in: [method]
  - id: s_R
    symbol: 'R'
    gloss: "uniform bound on how far an attribute can sit from the target"
    first_defined: appendix          # D28: the cost bound moved to A6
    scope: "assumed, and it is what turns the per-step error bound into a cost bound"
    appears_in: [appendix]
  - id: s_Cset
    symbol: '\mathcal{C}_t'
    gloss: "admissible candidate commands at step t"
    first_defined: method
    scope: "finite and nonempty"
    appears_in: [method]
  - id: s_s
    symbol: 's_t'
    gloss: "memory state, the stack of the last L+1 attribute readings"
    first_defined: method
    scope: "observable attributes only; no hidden activations"
    appears_in: [method, experiments]
  - id: s_L
    symbol: 'L'
    gloss: "number of past readings retained"
    first_defined: method
    scope: "window length; the ablation in appendix A1 varies it"
    appears_in: [method, experiments]
  - id: s_C
    symbol: 'C'
    gloss: "selector row that reads the current attribute out of the memory state"
    first_defined: method
    scope: "the row vector with a leading one; do not confuse with the candidate set"
    appears_in: [method]
  - id: s_Kop
    symbol: '\mathcal{K}_{c}'
    gloss: "command-conditioned Koopman operator on observables"
    first_defined: method
    scope: "the population object; K is its finite-dimensional approximation"
    appears_in: [method]
  - id: s_E
    symbol: 'E_{\phi}'
    gloss: "encoder from the memory state into a learned feature space (the lifting)"
    first_defined: method
    scope: "the identity in the reported instance; appears in the main text only inline, inside the lifting gloss paragraph 3.1 P6"
    appears_in: [method_inline_once, appendix, experiments]
    gloss_required: true             # D33: first appearance carries a plain-language paragraph
  - id: s_D
    symbol: 'D_{\psi}'
    gloss: "decoder from the feature space back to the memory state"
    first_defined: appendix          # D25: main-text equations are written in s-space
    scope: "the identity in the reported instance"
    appears_in: [appendix]
  - id: s_xi
    symbol: '\xi_t'
    gloss: "encoded memory state"
    first_defined: appendix          # D25
    scope: "the space the learned-lifting variant and the A6 proof work in"
    appears_in: [appendix]
  - id: s_K
    symbol: 'K'
    gloss: "latent transition matrix"
    first_defined: method
    scope: "shared across commands"
    appears_in: [method, experiments]
  - id: s_B
    symbol: 'B'
    gloss: "command column, the gain of one unit of command"
    first_defined: method
    scope: "one column, since the command is scalar"
    appears_in: [method, experiments]
  - id: s_b
    symbol: 'b'
    gloss: "latent bias"
    first_defined: method
    scope: "absorbs any command held constant across a trajectory"
    appears_in: [method]
  - id: s_g
    symbol: 'g_{\psi}'
    gloss: "attribute readout, the decoder followed by the selector"
    first_defined: appendix          # D25: the main text reads out with C
    scope: "need not be linear"
    appears_in: [appendix]
  - id: s_H
    symbol: 'H'
    gloss: "prediction horizon in interactions"
    first_defined: method
    scope: "truncated by the remaining interaction budget"
    appears_in: [method, experiments]
  - id: s_w
    symbol: 'w_h'
    gloss: "nonnegative weight on the h-step deviation"
    first_defined: method
    scope: "part of the scoring rule, not learned"
    appears_in: [method]
  - id: s_Jhat
    symbol: '\widehat{J}_t'
    gloss: "predicted cost of holding a candidate command"
    first_defined: method
    scope: "the quantity the controller minimizes"
    appears_in: [method]
  - id: s_eps
    symbol: '\varepsilon_{\mathrm{dyn}}, \varepsilon_{\mathrm{rec}}'
    gloss: "uniform bounds on the one-step state residual and on the readout residual"
    first_defined: method            # named in Proposition 1; formalized in A6
    scope: "assumed, not measured"
    appears_in: [method, appendix]
  - id: s_kappa
    symbol: '\kappa'
    gloss: "bound on the spectral norm of the transition"
    first_defined: appendix          # D28
    scope: "no contraction is assumed"
    appears_in: [appendix]
  - id: s_Lg
    symbol: 'L_g'
    gloss: "Lipschitz constant of the readout on the relevant region"
    first_defined: appendix          # D28
    scope: "local, not global"
    appears_in: [appendix]
  - id: s_Delta
    symbol: '\Delta_h'
    gloss: "h-step attribute prediction error bound"
    first_defined: method
    scope: "grows with the horizon unless the transition contracts"
    appears_in: [method, experiments]
  - id: s_deltaJ
    symbol: '\delta_J'
    gloss: "bound on the gap between predicted and actual held-command cost"
    first_defined: method
    scope: "the quantity that doubles in the selection bound"
    appears_in: [method]
  - id: s_Yset
    symbol: '\mathcal{Y}'
    gloss: "the set of attribute values a task counts as satisfying its constraint"
    first_defined: problem_formulation
    scope: "task-given; the reference r is chosen inside it, which is what ties the tracking objective to the reported satisfaction score"
    appears_in: [problem_formulation]
    status: pending_metric_definition   # D30: exact wording waits on the colleague's metric definition
  - id: s_ellnull
    symbol: '\ell_h^{\mathrm{null}}'
    gloss: "the same squared forecast error, for the best trivial null"
    first_defined: experiments
    scope: "the denominator of the reported skill score"
    appears_in: [experiments]
  - id: s_skill
    symbol: '\mathrm{Skill}_H'
    gloss: "one minus the ratio of rollout error to the best trivial null's rollout error"
    first_defined: experiments
    scope: "reported metric for the prediction tasks; zero means no better than the null"
    appears_in: [experiments]

equation_lattice:
  - id: eq_interaction
    label: "eq:interaction"
    operation_name: "sampling a reply from the frozen model and measuring its attribute"
    rhs_symbols: [s_ptheta, s_x, s_hist, s_u, s_V, s_o]
    in_section: problem_formulation   # D23
    has_gloss: true
    role: definition
  - id: eq_modeling_objective
    label: "eq:modeling_objective"
    operation_name: "squared error between the realized attribute and its h-step-ahead forecast, at each horizon step"
    rhs_symbols: [s_y, s_yhat, s_H, s_ell]
    in_section: problem_formulation   # D23: added when Problem Formulation split into Modeling
                                      # and Control. It is what makes the paper's reported metric
                                      # a multi-step quantity rather than a one-step one.
    has_gloss: true
    role: quality_claim
  - id: eq_prompt_protocol
    label: "eq:prompt_protocol"
    operation_name: "construction of the prompt from a numerical command and the dialogue"
    rhs_symbols: [s_P, s_x, s_hist, s_c, s_Cspace]
    in_section: method
    has_gloss: true
    role: definition
  - id: eq_memory_state
    label: "eq:memory_state"
    operation_name: "stack of the last L+1 attribute readings, with a selector row reading the current one back"
    rhs_symbols: [s_y, s_L, s_C, s_s]
    in_section: method
    has_gloss: true
    role: definition
  - id: eq_koopman_operator
    label: "eq:koopman_operator"
    operation_name: "conditional expectation of an observable one step ahead, given state and command"
    rhs_symbols: [s_Kop, s_s, s_c]
    in_section: method
    has_gloss: true
    role: definition
  - id: eq_koopman_model
    label: "eq:koopman_model"
    operation_name: "affine map of the delay-coordinate state plus a command-scaled column and a bias, read out by the selector row"
    rhs_symbols: [s_s, s_K, s_B, s_b, s_c, s_C]
    in_section: method
    has_gloss: true
    role: mechanism_probe
    notes: >-
      D25: the main text states this in s-space only. The general form, with the memory state
      replaced by a learned lifting, is described in words in 3.1 P6 and written out in A1.
  - id: eq_identification
    label: "eq:identification"
    operation_name: "least-squares fit of the transition, the command column and the bias to recorded one-step transitions"
    rhs_symbols: [s_s, s_c, s_K, s_B, s_b]
    in_section: method
    has_gloss: true
    role: definition
    notes: >-
      D27 (2026-09-19). The main text had no estimation equation at all: D19 moved the whole
      estimator to A1, which took the identification of the reported linear instance with it. The
      linear fit is a plain least-squares problem, unrelated to the loss-composition question D19
      was about, and it is the object that makes "we build a dynamics model" concrete. It is also
      why the model is identifiable from tens to hundreds of trajectories: the unknowns number in
      the tens. Home: 3.2.
  - id: eq_training_transition
    label: "eq:training_transition"
    operation_name: "one-step latent prediction from an encoded state and the applied command"
    rhs_symbols: [s_K, s_E, s_B, s_c, s_b]
    in_section: appendix   # D19: moved with the training objective
    has_gloss: true
    role: definition
  - id: eq_training_objective
    label: "eq:training_objective"
    operation_name: "weighted sum of a reconstruction, a latent-consistency and a next-state prediction squared error"
    rhs_symbols: [s_E, s_D, s_s]
    in_section: appendix   # D19: no consensus in the literature on the loss composition and no
                           # term ablation here, so it is estimator detail rather than a defended
                           # design choice
    has_gloss: true
    role: mechanism_probe
  - id: eq_rollout
    label: "eq:rollout"
    operation_name: "recursive propagation of the memory state under a held candidate command, read out at each step"
    rhs_symbols: [s_s, s_K, s_B, s_b, s_C, s_H, s_Cset]   # D25: s-space, no encoder or decoder
    in_section: method
    has_gloss: true
    role: mechanism_probe
  - id: eq_closed_form_rollout
    label: "eq:closed_form_rollout"
    operation_name: "matrix power of the transition applied to the current memory state, plus a geometric sum of the command and bias term"
    rhs_symbols: [s_s, s_K, s_B, s_b]   # D25: s-space
    in_section: method
    has_gloss: true
    role: mechanism_probe
  - id: eq_selection
    label: "eq:selection"
    operation_name: "argmin over candidate commands of a horizon-weighted squared deviation from the target"
    rhs_symbols: [s_w, s_r, s_H, s_Cset, s_Jhat]
    in_section: method
    has_gloss: true
    role: quality_claim
  - id: eq_residual_assumptions
    label: "eq:residual_assumptions"
    operation_name: "uniform bounds on the latent transition residual and the readout residual"
    rhs_symbols: [s_K, s_B, s_b, s_g, s_eps]
    in_section: appendix   # D28: assumptions stated in words in Proposition 1, formalized in A6
    has_gloss: true
    role: definition
  - id: eq_skill
    label: "eq:skill"
    operation_name: "one minus the ratio of the operator's summed horizon error to the best trivial null's summed horizon error"
    rhs_symbols: [s_ell, s_ellnull, s_H, s_skill]
    in_section: experiments
    has_gloss: true
    role: quality_claim
    # Added 2026-09-19. The generator had left this equation unlabelled to get past the gate,
    # which is the wrong direction: an unlabelled equation cannot be cross-referenced and the
    # gate cannot audit it. The fix is the contract entry, not a missing label.
  - id: eq_prediction_bound
    label: "eq:prediction_bound"
    operation_name: "geometric accumulation of the one-step residual through the readout"
    rhs_symbols: [s_eps, s_Delta]
    in_section: method
    env: proposition       # D34: lives inside Proposition 1; the Lipschitz form is in A6
    has_gloss: true
    role: mechanism_probe
  - id: eq_prediction_bound_full
    label: "eq:prediction_bound_full"
    operation_name: "geometric accumulation of the one-step residual through the readout Lipschitz constant"
    rhs_symbols: [s_eps, s_Lg, s_kappa, s_Delta]
    in_section: appendix   # D28: the closed form behind Proposition 1's first line
    has_gloss: true
    role: mechanism_probe
  - id: eq_selection_bound_proof
    label: "eq:selection_bound_proof"
    operation_name: "two applications of the cost bound around the argmin, written as the three-line proof"
    rhs_symbols: [s_deltaJ, s_Cset]
    in_section: appendix   # D28
    has_gloss: true
    role: quality_claim
  - id: eq_cost_bound
    label: "eq:cost_bound"
    operation_name: "difference-of-squares bound on the predicted versus actual held-command cost"
    rhs_symbols: [s_w, s_Delta, s_deltaJ, s_R]
    in_section: appendix   # D28
    has_gloss: true
    role: mechanism_probe
  - id: eq_selection_bound
    label: "eq:selection_bound"
    operation_name: "two applications of the cost bound around the argmin, giving twice the cost gap"
    rhs_symbols: [s_deltaJ, s_Cset]
    in_section: method
    env: proposition       # D34
    has_gloss: true
    role: quality_claim

mechanism_lattice:
  - id: m1
    mechanism: "A single attribute reading is consistent with two opposite trends, so a memoryless rule issues the same command in situations whose next step differs; a window of readings separates them."
    supports_claim: [c1]
    appears_in_method: true
    appears_in_experiments: true
    notes: "This is the colleague's own example in the Finite-Memory subsection; it is also ex_1."
  - id: m2
    mechanism: "Because the latent transition is affine and the command enters as one column, an h-step lookahead is a matrix power rather than another generation, so scoring many candidates costs no LLM calls."
    supports_claim: [c8, c5]
    appears_in_method: true
    appears_in_experiments: true
    notes: "The cost argument and the control argument share this mechanism."
  - id: m3
    mechanism: "Scoring a candidate on its predicted trajectory rather than its immediate effect lets the controller issue a command different from the target when the attribute is still moving, which is what removes overshoot."
    supports_claim: [c5, c6]
    appears_in_method: true
    appears_in_experiments: true
    notes: "The driver sentence behind the headline numbers."
  - id: m4
    mechanism: "The attribute readouts are already one-dimensional, so a learned lifting has little extra structure to expose and mainly adds estimation variance on trajectories that number in the tens or hundreds."
    supports_claim: [c2]
    appears_in_method: false
    appears_in_experiments: true
    notes: "Kept out of Method: Rule 21 bans results-shaped reasoning there. D19: its design counterpart, the training objective, now lives in appendix A1."
  - id: m5
    mechanism: "On the seven attribute-tracking tasks the applied command is the tracking error itself, an exact affine function of the memory state, so the command column carries no information the state does not already carry and the prediction design cannot see an action effect at all."
    supports_claim: []
    appears_in_method: false
    appears_in_experiments: true
    notes: "This is why nc_1 exists. It is a property of how those trajectories were collected, not a result. It belongs in the analysis subsection, as the reason the prediction table is silent about the command channel."

  - id: m6
    mechanism: "Each prompt item holds its own attribute level across turns, so several past readings estimate that level where a single reading cannot; most of what the delay embedding buys is this per-item level, and the part attributable to inter-turn dynamics is the smaller remainder."
    supports_claim: [c11]
    appears_in_method: false
    appears_in_experiments: true
    notes: "Side experiment P2 (2026-09-19). Measured, not assumed: the intercept share is 81% on constraint and 67% on items (s2). This mechanism also explains why planning has little headroom on the self-built tasks (nc_2): a level is not something a command sequence can exploit."

intuition_lattice:
  priors:
    - id: prior_1
      statement: "What a model wrote in the last few turns carries into what it writes next, so reply attributes have inertia rather than being drawn fresh each turn."
      borrowed_authority: [li2024instability, driftnomore2025, attractorstates2025]
      recorded_at: L3
      source: "story_framework_2026-09-18.md#2.1; supported in-repo by the last-turn row beating the stateless row on 10 of 11 columns, all 7 of the main-text columns among them (the one exception is average word length, -0.018)"
    - id: prior_2
      statement: "In deployment the only lever a caller holds is the text it sends, because the weights and the activations belong to someone else."
      borrowed_authority: []
      recorded_at: post_hoc
      source: "story_framework_2026-09-18.md#2.2 Gap 1; a framing decision, not a measurement"
    - id: prior_3
      statement: "The thing being controlled is a property of a whole reply, so the natural clock tick is one exchange and not one token."
      borrowed_authority: []
      recorded_at: post_hoc
      source: "story_framework_2026-09-18.md#2.3; follows from the verifier running on complete replies"
    - id: prior_4
      statement: "An instruction issued once has to compete with everything said after it, so its hold on the reply weakens as the conversation lengthens."
      borrowed_authority: [li2024instability, driftnomore2025, attractorstates2025]
      recorded_at: post_hoc
      source: >-
        D15 (2026-09-19): narrative beat 1 needed a candidate cause for the drift, so the reader is
        not asked to accept a phenomenon with no mechanism. This is the candidate, taken from the
        cited drift literature. This paper does NOT test it; see nc_9. Intro P1 states it as a
        plausible account, never as a finding, and carries a % CITE line.
    - id: prior_5
      statement: "A nonlinear one-step map can look close to linear once it is written in the right coordinates, the way a pendulum's angle evolves nonlinearly while its sine and cosine evolve almost linearly."
      borrowed_authority: []
      recorded_at: post_hoc
      source: >-
        D33 (2026-09-19): the source of the analogy in the lifting gloss paragraph (Method 3.1 P6),
        written for a reader who has not read a Koopman paper. It is an analogy, not a result; the
        alternative wording offered there is feature choice in linear regression. Exactly one of
        the two is used.
      kind: analogy
  anchor_example:
    id: ex_1
    instance: "the same sentence length can occur while successive revisions are becoming longer or while they are becoming shorter"
    illustrates: [prior_1, as_1]
    home: method_3.1_P2   # D25: the state window is a paragraph inside the model subsection now   # cold review f3: this paper has no separate Problem
                                          # Formulation section; the formalization entrance is the
                                          # first paragraph of the Finite-Memory subsection, which is
                                          # where the colleague's text already places this example
    covers_both_sides: true
    recorded_at: L3
    source: "sections/02_method.tex, Finite-Memory Koopman Dynamics, first paragraph (colleague's wording, kept verbatim)"
  failure_instances:
    - id: fx_1
      instance: "a rewrite pushed past the level it was aiming for"
      homes: [abstract, intro]
      quantified_by: rq1
      recorded_at: L3
      source: "the tsar_cefr overshoot observed in the self-built control runs; story_framework_2026-09-18.md#2.2 Gap 2"
  named_assumptions:
    - id: as_1
      name: "Assumption 1 (Finite-Memory Closure)"
      plain_statement: "A short window of recent attribute readings carries enough of the conversation to predict the next reading."
      formal_pointer: eq_memory_state
      strength: approximate
      tested_by: rq2a
      recorded_at: L3
      source: "sections/02_method.tex states it as an approximation, not an exact reconstruction"
    - id: as_2
      name: "Assumption 2 (Affine Latent Transition)"
      plain_statement: "On the delay coordinates of the verifier reading the next state is an affine function of the current state and the applied command."
      formal_pointer: eq_koopman_model
      strength: approximate
      tested_by: rq2b
      recorded_at: L3
      source: "sections/02_method.tex calls the shared transition and affine command dependence modeling restrictions"
    - id: as_3
      name: "Assumption 3 (Bounded Residuals and Lipschitz Readout)"
      plain_statement: "Over the candidate rollouts the model's one-step error and the readout error stay below fixed levels, and the readout does not amplify small latent differences without bound."
      formal_pointer: eq_residual_assumptions
      strength: approximate
      tested_by: motivational_only
      recorded_at: L3
      source: "sections/02_method.tex, Prediction Error and Intervention Selection"

terminology_bans:            # D29, enforced by tools/mech_audit.sh check 8
  - term: "test-time"
    replace_with: "inference-time, or during control"
    reason: "carries the test-time-alignment framing D22 removed"
  - term: "intervention"
    replace_with: "instruction (prose) / input (control-theoretic context)"
    reason: "an intervention/alignment word for what control theory calls the input; u_t is an instruction"
  - term: "alignment cost"
    replace_with: "tracking cost"
    reason: "D22"
  - term: "align / aligned / alignment"
    replace_with: "track / tracking"
    reason: "D22; naming someone else's work in Related Work is exempt via an on-line GATE-EXEMPT comment"
    exempt: "\\begin{aligned}; Related Work references to other papers by name"

terminology_glosses:         # terms the main text must explain once, in plain language
  - term: "lifting"
    home: method_3.1_P6
    spec: >-
      D33: 4-6 sentences, no formulas, in order: what it is (a change of coordinates into learned
      features in which the one-step map is closer to affine); one analogy (prior_5's pendulum, OR
      feature choice in linear regression, exactly one of the two); that this paper reports the
      identity lifting and keeps the learned one as a Table 1 comparison trained as in A1; why a
      learned lifting has little to expose when the reading is a scalar and the window is short.
      Audience: an ML reviewer who has never read a Koopman paper.

non_claim_ledger:
  # D16 (2026-09-19): these are AUDIT instruments, not prose. Tier 2 and Tier 3 do NOT write a
  # "we do not claim X" sentence for any of them. Their job is to stop a claim from drifting past
  # its evidence while the draft is being built and reviewed. `candidate_explicit` records where a
  # disclaimer WOULD go if the user later promotes it; the user picks the few that get stated out
  # loud, after the main text exists, so that scope sentences do not drown the argument.
  # Exception by construction: the point-estimate caveat required by D3 and D12 is NOT one of these.
  # It rides in c5.notes and c6.notes, attached to the number itself, and is written as a property
  # of the measurement rather than as a disclaimer.
  - id: nc_1
    statement: "That putting the command into the operator improves prediction."
    reason: "The prediction experiment gives no evidence either way. On the five core columns the applied command equals the tracking error, an exact affine function of the state, so that design cannot estimate an independent action effect at all (n_main_014 n_main_046 n_main_030 n_main_078 n_main_094, all status caveated for this reason). On the two columns where it can be estimated the paired difference is +0.0015 and +0.0061 with intervals containing zero (n_main_133 n_main_181). The command channel is exercised at control time, where the command varies, and that is where c5 and c6 test it."
    mode: audit_only
    candidate_explicit: [experiments, conclusion]
  - id: nc_2
    statement: "That closed-loop control beats an equal-cost fixed schedule on the four self-built behavioral tasks."
    reason: "It does not. On those tasks the closed loop ties the best fixed schedule while spending more, which is reported in appendix A4 as a boundary on where planning has headroom."
    mode: audit_only
    candidate_explicit: [experiments, conclusion]
  - id: nc_3
    statement: "That the benchmark numbers carry intervals, seed counts, or an independently specified metric."
    reason: >-
      They are point estimates supplied by a colleague with no raw logs in this repository
      (user decision D3). Cold review f2 (2026-09-18): c5 and c6 appear in the abstract and
      the introduction, so the scope has to travel with them. The abstract states the gain
      without an interval and without the word measured; the introduction carries one clause
      naming the numbers as point estimates on three public benchmarks.
    mode: audit_only
    candidate_explicit: [abstract, intro, experiments, conclusion]
  - id: nc_4
    statement: "That the language model admits an exact finite-dimensional Koopman representation."
    reason: "The model is a finite-dimensional approximation on a finite-memory state; the Method says so directly."
    mode: audit_only
    candidate_explicit: [method, conclusion]
  - id: nc_5
    statement: "That the closed loop converges, or that the candidate set always contains a command able to reach the target."
    reason: "The bound is a one-step held-command comparison. Re-observation resets the rollout's initial error but removes neither model mismatch nor the limits of the candidate set."
    mode: audit_only
    candidate_explicit: [method, conclusion]
  - id: nc_7
    statement: "That each of the three terms in the training objective is necessary."
    reason: >-
      No term-removal ablation was run for this paper, and the literature has no settled loss
      composition to fall back on (arXiv 2412.04578 states the loss functions and operator forms
      vary widely). D19 therefore moves the objective to appendix A1: an undefended choice does not
      get a Why-X in the main text. The reported instance is the linear special case, which does
      not use the autoencoder at all.
    mode: audit_only
    candidate_explicit: [appendix]
  - id: nc_8
    statement: "That the size of the command column has been measured against a no-command operator on the prediction tasks."
    reason: "See nc_1. The control results test whether selecting over commands helps; they do not decompose the operator."
    mode: audit_only
    candidate_explicit: [experiments]
  - id: nc_9
    statement: "That the paper identifies why multi-turn behavior drifts."
    reason: "Beat 1 and Intro P1 offer instruction dilution as a candidate account, borrowed from the drift literature. No experiment here separates it from other causes; the paper measures that the trajectory is predictable, not why it moves."
    mode: audit_only
    candidate_explicit: [intro, conclusion]
  - id: nc_6
    statement: "That the linear operator is a better sequence model than an LSTM."
    reason: "Two of seven columns favour the LSTM with intervals excluding zero (n_main_080 n_main_134). The paper claims cheap lookahead and a readable command channel, not universal predictive superiority."
    mode: audit_only
    candidate_explicit: [experiments]
