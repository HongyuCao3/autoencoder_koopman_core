# Tier 1 contract. Built 2026-09-17 (Opus 5), Phase A / Step 4 of
# docs/article/PAPER_EXECUTION_PLAN.md. Schema: neurips-write-tiered/references/contract.md.
#
# Evidence ids point at paper/evidence/numbers.yaml (1111 entries). Any claim citing a
# `caveated` id carries the caveat in its own `notes` field, per the Step 4 mechanical gate.
# Equation ids and operation names are taken from paper/equations.tex, which was finalized
# first (rule A5). Terminology follows docs/NAMING.md's English-name column.

meta:
  paper_title: "When Not to Close the Loop: A One-Sided Criterion for Multi-Turn LLM Behavior Control"
  acronym: null
  venue: NeurIPS
  page_limit: 9
  subfield: "multi-turn LLM behavior control and safety"
  arc_type: prior_injection

# ---------------------------------------------------------------------------------------
# NARRATIVE ARC -- working hypothesis, finalized after Method + Experiments (rule A9).
#
# SIGNED by the user 2026-09-17. The five beats locked on 2026-09-06 (PAPER_EXECUTION_PLAN
# section 1.3) had two beats that later evidence overturned; that document's own 2026-09-15
# correction note says so and routes the rewrite to CLOSED_LOOP_SYNTHESIS.md sections 5 and 6
# rather than rewriting section 1.3 in place. These five beats are built from that routed
# authority, not from section 1.3 verbatim. What changed against the 2026-09-06 lock:
#   beat 3  "nonlinear AE lifting buys no gain" -> stated as an effect-size claim with a
#           sign that flips across tasks, because two cells are nominally significant and
#           one of them favours the LSTM. (section 5 item, section 6 boundary)
#   beat 5  the RQ3 landing site is no longer gsm8k_sharded's closed loop (that line was
#           suspended 2026-09-08). It is Table 2's four columns side by side, all flat or
#           negative, and the deliverable is a ONE-DIRECTIONAL criterion. (section 5 item 1)
#
# TITLE, also signed 2026-09-17. The earlier title ("A Pre-Investment Criterion for ...") was
# marked PROVISIONAL in main.tex because it promised a two-sided criterion while only the zero
# side has been checked. The Tier-1 cold review reached the same place independently and gave
# two options: add a held-out line, or stop letting the criterion carry the title. A held-out
# line is out of reach before the deadline and CLOSED_LOOP_SYNTHESIS.md section 6.3 forbids
# manufacturing one by re-calibrating the instrument. The title now states the one-sidedness,
# so the scope survives page-limit compression instead of resting on one abstract sentence.
# ---------------------------------------------------------------------------------------
narrative_arc:
  - "Behavior drift over a multi-turn LLM interaction is a dynamical phenomenon, yet the
     interventions deployed against it are stateless: a per-turn classifier, a fixed template,
     or a one-shot system prompt."
  - "We inject a prior from control theory: model the trajectory of a scalar behavioral readout
     as a linear operator with an explicit action channel, so that the control input is the
     intervention an operator can actually issue."
  - "The prior holds, and it holds toward simplicity: delay embedding is measurably required on
     every column with the range to tell, while a learned nonlinear lifting and a sequence model
     move the fit by less than the paired bootstrap's own resolution, in a direction that is not
     even consistent across tasks."
  - "The action channel is where the prior stops paying: across four multi-turn settings no
     closed-loop controller beats an equal-cost fixed schedule, and four independent measurements
     return that same zero, two of which never touch our controller at all."
  - "What the paper delivers is therefore a criterion rather than a controller: before spending
     closed-loop compute, measure whether withholding the action changes the operator's fit at
     all; a zero there says do not invest. The criterion is one-directional, and we say so."

# ---------------------------------------------------------------------------------------
# DESIGN CHOICES -- one per planned Method subsection.
# ---------------------------------------------------------------------------------------
design_choice_lattice:
  - id: choice_1
    choice_name: "Delay-Embedded Controlled State"
    why_keyword: "a per-turn readout is not a state; the operator needs a fixed window of past
      readouts and the actions taken alongside them, or the fit is measuring persistence it
      cannot separate from dynamics"
    equation_operation: "concatenate a fixed number of lagged readout values, and for the
      augmented family an equal number of lagged control values formed as the tracking error,
      into one delay-embedded state vector"
    equation_id: eq_1
    rq_id: rq1
    finding_keyword: "delay embedding required on every column with range to tell it; depth is
      one tap on the core tasks under the matched window, four turns on constraint"
    intro_bullet_keyword: "a state construction whose necessity is measured rather than assumed"
    conclusion_takeaway_keyword: "memory is needed; the depth is shallower than the modeling
      convention assumes"
    source: "code:src/koopman_ae/core.py:169"
    intuition_refs: [prior_1, as_1]
    notes: "On the core line the control is an exact affine function of the state, so this
      subsection must state the rank deficiency where it introduces the augmented family."

  - id: choice_2
    choice_name: "Linear Operator with an Explicit Action Channel"
    why_keyword: "the action must enter the fitted map as its own regressor, because that is the
      only way withholding it becomes a measurable ablation rather than a modeling opinion"
    equation_operation: "lift the reduced state through an optional feature dictionary and fit an
      affine one-step map plus a separate ridge readout, two independent least-squares problems"
    equation_id: eq_5
    rq_id: rq2
    finding_keyword: "ours minus control-withheld is zero on all eleven columns, including the
      one column pre-registered to be non-zero"
    intro_bullet_keyword: "an action channel that can be switched off and measured"
    conclusion_takeaway_keyword: "the action channel carries no fit-relevant structure in any of
      these settings"
    source: "code:persona_drift_control/src/persona_drift/modeling/koopman.py:114"
    intuition_refs: [as_2]
    notes: ""

  - id: choice_3
    choice_name: "Reconstruction-Then-Ridge Estimation"
    why_keyword: "separating representation fitting from dynamics fitting keeps the dynamics
      estimate closed-form and lets the intercept stay unpenalized, so the operator is not
      shrunk toward a latent mean that the ridge term would otherwise absorb"
    equation_operation: "fit encoder and decoder by gradient descent on reconstruction alone,
      then freeze the encoder and solve one ridge least-squares problem for the latent dynamics,
      with the appended constant column's ridge coefficient forced to zero"
    equation_id: eq_3
    rq_id: rq4
    finding_keyword: "the learned lifting does not beat the linear operator on any column by more
      than the bootstrap resolution"
    intro_bullet_keyword: "a two-stage estimator whose dynamics half is closed-form"
    conclusion_takeaway_keyword: "the nonlinear half of the model is the half that does not pay"
    source: "code:src/koopman_ae/core.py:712"
    intuition_refs: []
    notes: "The zeroed intercept penalty is undocumented in the code; the Method text states it.
      Secondary equations for this subsection: eq_2 (the lift and latent dynamics it estimates) and
      eq_4 (the joint objective it is the alternative to). The schema carries one equation_id, so
      those two are recorded here rather than left as orphans."

  - id: choice_4
    choice_name: "Budget-Pruned Action Search"
    why_keyword: "a reminder budget is a hard count, not a soft cost, so the admissible action
      set shrinks as the budget is spent and the constraint is enforced by pruning the search
      rather than by a penalty that could be traded away"
    equation_operation: "enumerate the binary action tree to the planning horizon, score each
      branch by summed predicted readout minus a repeat penalty, and emit the first action of
      the best branch, with spent budget collapsing every deeper node to the null action"
    equation_id: eq_6
    rq_id: rq3
    finding_keyword: "no column beats its equal-cost fixed schedule; two of three flat columns
      cost more than the schedule they tie"
    intro_bullet_keyword: "a closed-loop controller built to be beaten honestly by open loop"
    conclusion_takeaway_keyword: "closed loop does not pay at equal cost in any of these settings"
    source: "code:persona_drift_control/src/persona_drift/control.py:301"
    intuition_refs: [as_2]
    notes: "Must not be written as a constrained program; the constraint IS the pruning.
      Secondary equation: eq_7, the closed-form margin, which is a special case of this search and
      not the decision rule; equations.tex records why."

  - id: choice_5
    choice_name: "Operator Diagnostics as a Pre-Investment Test"
    why_keyword: "the same fit that would drive a controller already answers whether a controller
      could buy anything, and it answers before the closed-loop compute is spent"
    equation_operation: "build the finite-horizon controllability matrix and Gramian, take rank,
      singular values, eigenvalues and condition number, alongside the spectrum of the transition
      matrix alone"
    equation_id: eq_8
    rq_id: rq3
    finding_keyword: "the withheld-action contrast predicted every closed-loop zero in advance,
      on all four lines, at zero GPU cost"
    intro_bullet_keyword: "a pre-investment criterion derived from the identification fit alone"
    conclusion_takeaway_keyword: "a zero in the withheld-action contrast is a reason not to invest;
      the non-zero side of the criterion is untested"
    source: "code:src/koopman_ae/core.py:45"
    intuition_refs: [as_3]
    notes: "One-directional. The pre-registered positive control did not fire; see nc_2."

# RQ set (bodies are written in Tier 2 section Experiments; their MEANING is fixed here so the
# rq_id references above and the tested_by references below cannot drift apart):
#   rq1  Is delay-embedded memory required, and how deep?
#   rq2  Does the action channel carry any structure the operator's fit can see?
#   rq3  Does closed-loop control beat an equal-cost fixed schedule, and does rq2 predict it?
#   rq4  Does a learned nonlinear lifting or a sequence model beat the linear operator?
#   rq5  What does the memory gain decompose into, once item identity is given to the baseline?
#
# ---------------------------------------------------------------------------------------
# CLAIM LEDGER
# ---------------------------------------------------------------------------------------
claim_ledger:
  - id: c1
    claim: "Delay-embedded memory is required: on every column whose readout has the range to
      resolve it, the delay-embedded operator beats a memoryless state by a margin whose paired
      bootstrap interval excludes zero."
    strength: scoped
    evidence: [n_main_013, n_main_045, n_main_077, n_main_132, n_main_180]
    appears_in: [abstract, intro, experiments, conclusion]
    driver_keyword: "the readout carries history the current turn does not"
    notes: "SCOPED, not strong, for two reasons that must appear in the same sentence as the
      claim. First, one core column runs the other way with an interval excluding zero
      (n_main_061, average_word_length_t5, -0.409 on 14 groups). Second, the word 'informative'
      is doing real work: gsm8k_sharded and defense are excluded as having no range, and that
      exclusion must be stated, not implied. The abstract's phrase 'in every informative
      comparison' needs an explicit definition of informative or tsar_cefr becomes a
      counterexample once the matched window is applied (see c2)."

  - id: c2
    claim: "Part of what the delay embedding buys is a training-window artifact, not dynamics:
      under a window matched across depths the core gains shrink by factors of 1.3 to 5.5, one
      column flips sign, and tsar_cefr collapses from a significant +0.0487 to +0.0053 crossing
      zero. The constraint line is unaffected."
    strength: strong
    evidence: [n_abl_124, n_abl_184, n_abl_238, n_abl_262]
    appears_in: [experiments, conclusion]
    driver_keyword: "shallow states are trainable from earlier transitions than deep ones"
    notes: "This is our own negative finding about our own headline. It is STRONG because it was
      measured directly with a matched-window companion under the same folds and bootstrap. It
      constrains c1's wording everywhere c1 appears."

  - id: c3
    claim: "A learned nonlinear lifting and an LSTM do not beat the linear operator: on the
      informative columns the difference in Skill_H never exceeds 0.031 in absolute value, and its
      sign is not consistent across tasks."
    strength: scoped
    evidence: [n_main_015, n_main_016, n_main_080]
    appears_in: [abstract, intro, experiments, conclusion]
    driver_keyword: "simplicity measured rather than assumed"
    notes: "Must not be written as 'statistically indistinguishable'. Two cells are nominally
      significant and on one of them the LSTM is better by -0.031 (n_main_080,
      character_length_t5). The tsar_cefr cells (n_main_182 +0.668, n_main_183 +0.599) are NOT
      evidence for this claim and must not be pooled with the other ten columns: neither
      baseline cleared the trivial null there, which is a sample-size fact (597 trajectories x
      6 steps), not a statement about nonlinearity."

  - id: c4
    claim: "Putting the action into the operator buys nothing measurable: the contrast between
      the fitted operator and the same operator with the control withheld contains zero on all
      eleven main-table columns."
    strength: scoped
    evidence: [n_main_133, n_main_181, n_main_014, n_main_030, n_main_046]
    appears_in: [abstract, intro, experiments, conclusion]
    driver_keyword: "the action channel carries no fit-relevant structure"
    notes: "Cites caveated ids. Two caveats travel with them and must be in the same sentence.
      (a) On the core columns (n_main_014, n_main_030, n_main_046) the control is an exact
      affine function of the state, so those columns cannot estimate an independent action
      effect at all; they are not independent confirmations and the claim rests on the
      behavioral lines. (b) tsar_cefr (n_main_181) is the column where all three qualifying
      conditions hold and it was PRE-REGISTERED to be non-zero; it came in at +0.0061 with the
      interval containing zero. That failed positive control is the reason c7 is one-directional."

  - id: c5
    claim: "Closed-loop control does not beat an equal-cost fixed schedule in any of the four
      settings: two columns are flat with intervals containing zero, one is negative, and the fourth
      is identical to its open-loop baseline by construction."
    strength: strong
    evidence: [n_loop_048, n_loop_060, n_loop_061, n_loop_040]
    appears_in: [abstract, intro, experiments, conclusion]
    driver_keyword: "no state-dependent structure in the timing of the action"
    notes: "Cites one caveated id, n_loop_040 (defense, -0.0250). Three caveats in the same
      sentence: the defense column is self-judged under the project's single named exception,
      its significance depends on the resampling unit (per-attack excludes zero, per-trajectory
      contains it, with only 8 attacks clustering the bootstrap), and it has two data seeds.
      Wording red line: outside the defense column no baseline WON. The honest form is 'tied,
      and ours cost more'. Writing 'a simple baseline beat Koopman-MPC' exceeds the data."

  - id: c6
    claim: "The closed-loop zero is a property of these task families rather than a tuning
      failure: an oracle that sees each attack's best intervention turn in hindsight gains only
      +0.0375, a causal oracle cross-fitted across attacks gains nothing, and a clairvoyant
      oracle that sees the future gains +0.0896 -- so even a perfect controller measurable
      against this readout has almost nothing to win."
    strength: scoped
    evidence: [n_loop_044, n_loop_046, n_loop_047, n_loop_045]
    appears_in: [experiments, conclusion]
    driver_keyword: "the ceiling on adaptivity, not the controller, is what is small"
    notes: "All four ids are caveated. The bounds are self-judged (defense line) AND they bound
      only policies measurable with respect to the y readout; a controller reading raw text or
      activations is not bounded by them. Both statements travel with every quotation. SCOPED
      because the ceiling was measured on one of the four lines, not all four."

  - id: c7
    claim: "The withheld-action contrast works as a pre-investment test: on all four lines it
      returned zero before the closed-loop experiments ran, and the closed-loop experiments then
      returned zero."
    strength: scoped
    evidence: [n_main_133, n_main_181, n_loop_048, n_loop_060]
    appears_in: [abstract, intro, experiments, conclusion]
    driver_keyword: "the identification fit already answers whether control can pay"
    notes: "ONE-DIRECTIONAL, and the paper says so in the same breath. The criterion has been
      checked only on its zero side. Its positive side would need a task family where the
      contrast is genuinely non-zero and the closed loop then pays; no such family exists here.
      The pre-registered positive control (tsar_cefr, n_main_181) was supposed to supply exactly
      that and did not fire. See nc_2. The title was changed on 2026-09-17 to state this
      one-sidedness rather than leave it to the abstract: the criterion is what the paper sells, so
      the scope belongs where it cannot be cut for space. The cold review's alternative fix, a
      held-out task family where the contrast is non-zero and the closed loop then pays, does not
      exist and must not be manufactured by re-calibrating the identification caliber."

  - id: c8
    claim: "Most of what the delay embedding buys is persistent item-level heterogeneity rather
      than cross-turn dynamics: giving the memoryless baseline a per-item intercept absorbs 81
      percent of the gain on constraint and 67 percent on the strongest core column, and what
      survives is significant on two columns only."
    strength: scoped
    evidence: [n_mech_059, n_mech_056]
    appears_in: [experiments, conclusion]
    driver_keyword: "item identity, not turn-to-turn propagation"
    notes: "Any sentence that says the delay embedding carries cross-turn dynamics must carry
      this share in the same place. tsar_cefr (n_mech_068, caveated) is NOT a third supporting
      column and must not be pooled: there the intercept ate nothing because under the matched
      window there was no gain left to decompose, and that line's seed state is a synthetic
      value that makes an item intercept nearly free."

  - id: c9
    claim: "Choosing the instruction family matters more than choosing the action sequence: on
      the readability line the gap between two prompt families is 0.0395 while the full range
      across three control policies inside one family is 0.0129."
    strength: observation
    evidence: [n_loop_058, n_loop_060, n_loop_061]
    appears_in: [experiments]
    driver_keyword: "the prompt family is the larger free parameter"
    notes: "OBSERVATION, not a claim: it comes from one line. The signed main contrast n_loop_058
      is caveated and every quotation of it must carry dp_degeneracy = 1.0 in the same sentence,
      because all 199 DP paths equal the adjacent ladder, so that contrast is mostly a
      prompt-family effect rather than a control effect."

