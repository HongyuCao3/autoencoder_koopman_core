equation_lattice:
  - id: eq_1
    label: "eq:delay-state"
    operation_name: "concatenate a fixed number of lagged readout values and, for the augmented
      family, an equal number of lagged control values into one delay-embedded state vector"
    rhs_symbols: [s1, s2, s3, s5, s6]
    in_section: problem_formulation
    has_gloss: false
    role: definition
  - id: eq_2
    label: "eq:ae-koopman"
    operation_name: "encode the state, advance the latent vector by an affine map driven by the
      per-trajectory target, decode, and read the observable off a fixed slice of the decode"
    rhs_symbols: [s2, s5, s7, s8]
    in_section: method
    has_gloss: false
    role: definition
  - id: eq_3
    label: "eq:stage-two-solve"
    operation_name: "fit encoder and decoder on reconstruction alone, then freeze the encoder and
      solve one ridge least-squares problem for the latent dynamics with the intercept column's
      ridge coefficient forced to zero"
    rhs_symbols: [s7, s8, s11, s5]
    in_section: method
    has_gloss: false
    role: definition
  - id: eq_4
    label: "eq:joint-batch"
    operation_name: "weight four mean-squared-error terms but descend them on two different
      optimizer schedules, so no single scalar is minimized by a single step"
    rhs_symbols: [s2, s7, s8, s18]
    in_section: method
    has_gloss: false
    role: definition
  - id: eq_5
    label: "eq:beh-dynamics"
    operation_name: "lift the reduced state through an optional feature dictionary and fit an
      affine one-step map plus a separate ridge readout, two independent least-squares problems"
    rhs_symbols: [s4, s9, s10]
    in_section: method
    has_gloss: false
    role: mechanism_probe
  - id: eq_6
    label: "eq:mpc-value"
    operation_name: "enumerate the binary action tree to the planning horizon, score each branch
      by summed predicted readout minus a repeat penalty, emit the first action of the best branch,
      and prune every deeper node to the null action once the budget is spent"
    rhs_symbols: [s4, s9, s10, s12, s13]
    in_section: method
    has_gloss: false
    role: definition
  - id: eq_7
    label: "eq:margin-closed-form"
    operation_name: "evaluate the one-step gain in predicted readout from acting, as an affine
      function of the current readout, and solve its zero crossing for an indifference threshold"
    rhs_symbols: [s1, s10]
    in_section: method
    has_gloss: false
    role: mechanism_probe
  - id: eq_8
    label: "eq:ctrb"
    operation_name: "build the finite-horizon controllability matrix and Gramian, take their rank,
