# Merged Step 2a evidence (docs/article/PAPER_EXECUTION_PLAN.md). Six evidence lines extracted in parallel by Sonnet 5, then concatenated here (ids already globally unique via per-line prefixes n_core_/n_def_/n_op_/n_syc_/n_read_/n_base_). Every entry: status=unknown, superseded_by=null, supersede_reason=null -- Step 2b (Opus 5) still needs to run the supersession judgment pass before any entry can be cited by contract.yaml's claim_ledger.
# Source order: numbers_core.yaml (核心 AE-Koopman 八阶段消融); numbers_defense.yaml (对抗防御 Koopman-MPC Phase A→J); numbers_operator.yaml (算子的额外用途（谱/Gramian/闭式策略/残差检测）); numbers_sycophancy.yaml (sycophancy 惯性（MMLU 数据源）); numbers_readout.yaml (读出分辨率天花板); numbers_baseline.yaml (LSTM/ARX/AE baseline 对照)
# Step 2b (Opus 5, 2026-09-06) ran the supersession judgment. status is now three-valued, not two:
#   current    -- citable as-is.
#   superseded -- a better estimate of the same quantity exists; superseded_by names it. Never cite as an estimate.
#   caveated   -- the only measurement available, but produced under a protocol this project later found confounded,
#                 or usable only inside a stated comparison. Citable ONLY with the caveat in supersede_reason stated
#                 in the same sentence. Step 4's claim_ledger may reference these; it must carry the caveat with them.
# superseded_by points to an entry that is not itself superseded (current or caveated) -- a replacement value may
# legitimately still carry a caveat (e.g. Phase I levels replace Phase H but remain self-judge scores).
# Event codes used in supersede_reason: E1 v-alignment bug; E2 core-task early-stopping confound; E3 self-judge ->
# independent judge; E4 sycophancy data-source change + sample expansion; E5 Phase J 2->5 seed; E6 Phase B
# random_excite seeding bug; E7 stale reference baselines inside interaction_model_report_valigned.json;
# E8 LSTM early-stopping caliber; E9 AE early-stopping follow-up; E10 turn-1 baseline gating. See superseded.md.
