sound:
  - "Rule 24: exactly one Why-X paragraph in 3.2, 3.3, and 3.4; none in 3.1 or 3.5 (substantive intent, per the two Opus patches)."
  - "Rule 22: all three Why-X bullets (3.2, 3.3, 3.4) are formula-free, number-free, symbol-free."
  - "Rule 21: no numeric result, no named-baseline comparison, and no pointer to a results table anywhere in the §Method block; the linear special case is never framed as the instance that won."
  - "D19 compliance: all three Why-X bullets argue their instantiation (the windowed quantity; that language can carry a command coordinate; black-box scoring) rather than defending delay embedding, affine lifting, or MPC as machinery."
  - "Symbol coverage: all 30 symbol_lattice entries with first_defined=method are introduced exactly once in §Method, with no gaps or duplicate introductions (mechanically verified)."
  - "Equation coverage: all 12 equation_lattice entries with in_section=method are introduced exactly once; eq_training_transition and eq_training_objective correctly carry zero introductions in Method (moved to appendix per D19)."
  - "Bracketed-ID integrity: every bracketed ID referenced in the §Method block resolves to an existing paper/contract.yaml entry; none dangling."
  - "Example economy: [ex_1] appears exactly once, in 3.2; [fx_1] does not appear anywhere in §Method."
  - "D16 non-claim leakage: no bullet plans a new \"we do not claim X\" disclaimer sentence; the two colleague-authored scope statements retained verbatim (no exact finite-dimensional representation in 3.3 P4; no convergence guarantee in 3.5 P5) are the allowed exception, both already present in 02_method.tex."

judgment:
  opus_patch_3_2_verdict: >-
    Resolves the conflict it names. Treating the anchor-example sentence and the bolded
    "Why a Verifier's Reading" argument as one prose paragraph satisfies A11 (intuition
    precedes formalism), Rule 24 (one Why-X, at the head of the subsection), and Rule 22
    (the anchor sentence carries no symbol or number) simultaneously. The residual issue is
    mechanical, not substantive: the outline still shows two P-numbered, Why-X-tagged bullets,
    which a naive grep-based Rule 24 check would flag (see f4).
  opus_patch_3_5_verdict: >-
    Resolves the orphan-underline violation it names: 3.5 P5's underlined answer now has a
    paired bolded question at the head of the subsection, and Rule 24's one-Why-X budget is
    untouched because the new paragraph is tagged as a question, not a Why-X. The fix
    introduces a new role tag ("question") that is not part of semantic.md's documented
    §Method role vocabulary, which is a real but minor process risk for Tier-3 generation
    (see f3).
  one_method_or_three_modules: >-
    §Method reads as one coupled method, not three loosely joined modules. The finite-memory
    state (3.2) is explicitly built to feed the operator (3.2 P4's bridge), the operator's
    symbols (s_E, s_K, s_B, s_b, s_g) are reused without re-introduction through 3.3, 3.4, and
    3.5, and the closed-form rollout (3.4) and the error bound (3.5) both depend directly on
    the operator's affine structure introduced in 3.3. Mechanisms m2 and m3 and claims c8 and
    c9 thread across the last three subsections rather than resetting per subsection, and the
    theoretical guarantee in 3.5 has no content of its own independent of the operator and the
    selection rule it is bounding. The two Opus-patched paragraphs (3.2's merged anchor+Why-X,
    3.5's added question) are stylistic grafts with minor mechanical seams (f3, f4, f6) but do
    not fracture this pipeline coupling.
