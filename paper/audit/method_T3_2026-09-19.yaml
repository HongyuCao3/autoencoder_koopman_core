sound:
  - "Rule 21 (no experimental results in §Method): no numbers, no baseline names, no §Experiments pointers found anywhere in 02_method.tex; the identity-encoder paragraph (lines 172-177) names the reported instance without framing it as the one that won."
  - "Rule 22/24 (Why-X paragraphs): exactly three \\textbf{Why...} paragraphs, at the heads of §3.2, §3.3, §3.4 and nowhere else; each is formula-free, number-free, symbol-free, and closes with a \\uline{} answer folded into the same paragraph with no blank line before it."
  - "All three Why-X paragraphs argue the instantiation, not the settled machinery: each explicitly names the standard result (windowing for partial observability, an affine input column, MPC on a lifted linear predictor) and pivots the argument to the paper's specific choice (a verifier's reading; a scalar command coordinate carried by the prompting protocol; scoring without opening the model). Each underlined answer directly answers its own bolded lead."
  - "Math-prose alignment (Rule 14) holds for all 12 numbered equations in 02_method.tex and both numbered equations in A1_estimator.tex: in every case the surrounding prose names the operation the equation actually performs (no inflated verbs, e.g. no 'directional'/'normalized' language over an unnormalized quantity)."
  - "The roman selector row $C$ (eq:memory_state) is never confused with the calligraphic command sets $\\mathcal{C}$/$\\mathcal{C}_t$; the two are typographically distinct and used consistently throughout."
  - "The memory-state letter 's' is not reused as a bound/summation index anywhere; all sums in the section index on h or j, and the rollout-step notation $s_h^c$ is explicitly tied back to $s_t$ ($s_0^c = s_t$)."
  - "All three named scope statements the co-author's text carried survive intact: no exact finite-dimensional Koopman representation is assumed (line 167-168), no convergence or reachability guarantee is claimed (line 367-368), and control additionally depends on coverage of command-history pairs at inference (line 275-276). The prompting-protocol scope statement (lines 56-58) and the finite-memory approximation scope statement (lines 100-103) also survive verbatim."
  - "Appendix A1's one-sentence main-text pointer (lines 179-182) is coherent with A1's actual content: A1 supplies the transition-tuple construction and the three-term training objective it promises, so the restructure leaves no hole in the main-text argument, only a compression move."
